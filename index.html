<!DOCTYPE html>
<html lang="es" class="h-full bg-[#0b071a]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta EduSync - Academium Live</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase App y Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
        }
        
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-16px) rotate(4deg); }
        }
        .animate-float { 
            animation: floatSlow 6s ease-in-out infinite; 
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.4)); }
            50% { opacity: 0.8; filter: drop-shadow(0 0 35px rgba(168, 85, 247, 0.8)); }
        }
        .animate-glow {
            animation: pulseGlow 4s ease-in-out infinite;
        }

        .glass-card {
            background: rgba(15, 12, 34, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 8px;
        }
    </style>
</head>
<body class="h-full flex flex-col text-slate-100 bg-[#0b071a] relative min-h-screen overflow-x-hidden selection:bg-purple-500 selection:text-white">

    <!-- ========================================== -->
    <!-- FONDO ACADEMIUM 3D: MANCHAS NEÓN + AVATAR VR + VORTEX -->
    <!-- ========================================== -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -bottom-32 -left-32 w-[500px] h-[500px] bg-purple-900/40 rounded-full blur-[120px] opacity-70"></div>
        <div class="absolute top-1/4 -left-20 w-80 h-80 bg-cyan-600/20 rounded-full blur-[100px] opacity-50"></div>
        <div class="absolute top-10 right-10 w-96 h-96 bg-fuchsia-600/30 rounded-full blur-[130px] opacity-60"></div>
        
        <div class="absolute top-12 right-0 w-full lg:w-[58%] h-[calc(100vh-3rem)] flex justify-end items-center opacity-30 lg:opacity-100 transition-opacity">
            <svg class="w-full h-full max-h-[850px] object-cover animate-glow" viewBox="0 0 700 700" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M650 100C720 200 680 350 640 480C600 610 520 680 380 660C240 640 180 520 210 410C240 300 320 260 370 190C420 120 580 0 650 100Z" fill="url(#academium-grad)" opacity="0.85"/>
                
                <path d="M250 280 Q 450 180, 620 320 T 500 550" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" opacity="0.4" fill="none"/>
                <path d="M300 220 Q 500 140, 660 260" stroke="#ff007f" stroke-width="3" stroke-linecap="round" opacity="0.3" fill="none"/>
                
                <circle cx="580" cy="180" r="36" fill="#c084fc" opacity="0.5"/>
                <circle cx="595" cy="170" r="14" fill="#00f0ff" opacity="0.8"/>
                <circle cx="280" cy="490" r="24" fill="#f472b6" opacity="0.7"/>
                <rect x="520" y="440" width="28" height="28" rx="6" transform="rotate(25 520 440)" fill="#60a5fa" opacity="0.7"/>
                
                <path d="M480 120 L484 130 L494 134 L484 138 L480 148 L476 138 L466 134 L476 130 Z" fill="#00f0ff" opacity="0.9"/>
                <path d="M320 360 L323 367 L330 370 L323 373 L320 380 L317 373 L310 370 L317 367 Z" fill="#ffffff" opacity="0.9"/>
                
                <g class="animate-float" transform="translate(320, 260) scale(1.15)">
                    <path d="M60 140 C40 120, 20 100, -10 110 C-20 115, -10 130, 10 130 C30 130, 50 145, 70 160 Z" fill="#38bdf8"/>
                    <path d="M140 130 C170 145, 200 130, 220 150 C225 155, 215 165, 200 160 C180 155, 150 160, 130 145 Z" fill="#38bdf8"/>
                    <path d="M50 130 L150 120 L160 180 L40 190 Z" fill="#0284c7"/>
                    <circle cx="100" cy="90" r="26" fill="#0f172a"/>
                    <rect x="80" y="80" width="42" height="20" rx="8" fill="#f43f5e"/>
                    <rect x="84" y="84" width="34" height="12" rx="5" fill="#00f0ff" opacity="0.9"/>
                </g>

                <defs>
                    <linearGradient id="academium-grad" x1="200" y1="50" x2="680" y2="650" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#8b5cf6" />
                        <stop offset="50%" stop-color="#6b00d7" />
                        <stop offset="100%" stop-color="#2e005c" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- HEADER ACADEMIUM -->
    <!-- ========================================== -->
    <header class="bg-[#120a2a]/80 backdrop-blur-md border-b border-purple-500/20 text-white shadow-2xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between relative z-10">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#6b00d7] to-[#a824fd] flex items-center justify-center text-white font-bold text-xl border border-purple-300/30 shadow-[0_0_15px_rgba(168,85,247,0.4)]">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div class="flex items-center gap-2">
                    <span class="font-black text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white via-purple-200 to-cyan-300">Academium</span>
                    <span class="text-xs bg-purple-500/20 text-purple-300 border border-purple-500/40 px-2.5 py-0.5 rounded-full font-bold">Feedback ABP</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <span class="text-xs font-black text-amber-300 tracking-widest hover:text-amber-200 cursor-pointer uppercase py-1.5 px-3.5 rounded-xl bg-amber-400/10 border border-amber-400/20 hover:bg-amber-400/20 transition">INICIO</span>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- CONTENEDOR DE LA ENCUESTA -->
    <!-- ========================================== -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 flex items-center justify-start relative z-10">
        
        <div class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 space-y-6 relative overflow-hidden">
            
            <div class="text-center space-y-1">
                <h2 class="font-black text-2xl tracking-tight text-white">Evaluación <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400">EduSync</span></h2>
                <p class="text-xs text-purple-300/70 font-semibold tracking-wide">Prototipo ABP 2026</p>
            </div>

            <!-- FORMULARIO -->
            <form id="formEncuesta" class="space-y-5 text-xs">
                
                <!-- CAMPO 1: ROL EN LA INSTITUCIÓN -->
                <div class="space-y-2">
                    <label for="rol" class="block font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-user-gear text-purple-400"></i> 1. Rol en la institución:
                    </label>
                    <select id="rol" required onchange="playClickSound()" class="w-full bg-slate-900/90 border border-purple-500/30 text-white text-xs rounded-xl p-3.5 font-semibold outline-none focus:ring-2 focus:ring-[#a824fd] focus:border-transparent transition">
                        <option value="" class="bg-slate-900 text-slate-400">-- Seleccionar --</option>
                        <option value="Docente" class="bg-slate-900 text-white">Docente / Profesor</option>
                        <option value="Jurado" class="bg-slate-900 text-white">Evaluador / Jurado</option>
                        <option value="Estudiante" class="bg-slate-900 text-white">Estudiante</option>
                        <option value="Padre de familia / Representante" class="bg-slate-900 text-white">Padre de familia / Representante</option>
                    </select>
                </div>

                <!-- CAMPO 2: CALIFICACIÓN POR ESTRELLAS (INTERACTIVO CON AUDIO Y GLOW) -->
                <div class="space-y-2">
                    <label class="block font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-star text-amber-400"></i> 2. Calificación del prototipo:
                    </label>
                    
                    <div class="grid grid-cols-5 gap-2 bg-slate-900/90 p-2.5 rounded-xl border border-purple-500/30">
                        <!-- 1 Estrella -->
                        <button type="button" onclick="setRating(1)" id="star-btn-1" class="star-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-700 bg-slate-800/50 text-slate-400 font-bold transition duration-200 hover:scale-105">
                            <i class="fa-solid fa-star text-sm mb-1"></i> 1★
                        </button>
                        <!-- 2 Estrellas -->
                        <button type="button" onclick="setRating(2)" id="star-btn-2" class="star-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-700 bg-slate-800/50 text-slate-400 font-bold transition duration-200 hover:scale-105">
                            <i class="fa-solid fa-star text-sm mb-1"></i> 2★
                        </button>
                        <!-- 3 Estrellas -->
                        <button type="button" onclick="setRating(3)" id="star-btn-3" class="star-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-700 bg-slate-800/50 text-slate-400 font-bold transition duration-200 hover:scale-105">
                            <i class="fa-solid fa-star text-sm mb-1"></i> 3★
                        </button>
                        <!-- 4 Estrellas -->
                        <button type="button" onclick="setRating(4)" id="star-btn-4" class="star-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-700 bg-slate-800/50 text-slate-400 font-bold transition duration-200 hover:scale-105">
                            <i class="fa-solid fa-star text-sm mb-1"></i> 4★
                        </button>
                        <!-- 5 Estrellas -->
                        <button type="button" onclick="setRating(5)" id="star-btn-5" class="star-btn flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-700 bg-slate-800/50 text-slate-400 font-bold transition duration-200 hover:scale-105">
                            <i class="fa-solid fa-star text-sm mb-1"></i> 5★
                        </button>
                    </div>
                    
                    <!-- Radios ocultos de respaldo para el formulario -->
                    <div class="hidden">
                        <input type="radio" name="nota" id="star-1" value="1" required>
                        <input type="radio" name="nota" id="star-2" value="2">
                        <input type="radio" name="nota" id="star-3" value="3">
                        <input type="radio" name="nota" id="star-4" value="4">
                        <input type="radio" name="nota" id="star-5" value="5">
                    </div>
                </div>

                <!-- CAMPO 3: MÓDULO MÁS ÚTIL -->
                <div class="space-y-2">
                    <label for="funcion" class="block font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-cyan-400"></i> 3. Módulo más útil:
                    </label>
                    <select id="funcion" required onchange="playClickSound()" class="w-full bg-slate-900/90 border border-purple-500/30 text-white text-xs rounded-xl p-3.5 font-semibold outline-none focus:ring-2 focus:ring-[#a824fd] focus:border-transparent transition">
                        <option value="" class="bg-slate-900 text-slate-400">-- Seleccionar --</option>
                        <option value="Anti-Saturación" class="bg-slate-900 text-white">Calendario Anti-Saturación</option>
                        <option value="Minutas" class="bg-slate-900 text-white">Gestor de Minutas</option>
                        <option value="Canales" class="bg-slate-900 text-white">Matriz de Canales Oficiales</option>
                    </select>
                </div>

                <!-- CAMPO 4: RECOMENDACIÓN O COMENTARIO -->
                <div class="space-y-2">
                    <label for="comentario" class="block font-bold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-comment-dots text-purple-400"></i> 4. Recomendación o comentario:
                    </label>
                    <textarea id="comentario" rows="3" placeholder="Escribe tu opinión aquí..." class="w-full bg-slate-900/90 border border-purple-500/30 text-white text-xs rounded-xl p-3.5 outline-none focus:ring-2 focus:ring-[#a824fd] focus:border-transparent transition placeholder:text-slate-500"></textarea>
                </div>

                <!-- BOTÓN SUBMIT -->
                <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-[#6100e0] to-[#a824fd] hover:from-[#5200bd] hover:to-[#9317e3] text-white text-xs font-extrabold py-4 rounded-xl shadow-[0_0_25px_rgba(168,85,247,0.4)] transition transform active:scale-95 flex items-center justify-center gap-2 mt-3 cursor-pointer uppercase tracking-wider">
                    <i class="fa-solid fa-paper-plane"></i> Enviar respuesta
                </button>
            </form>

            <!-- MENSAJE DE ÉXITO HIGH-TECH -->
            <div id="mensaje" class="hidden text-center p-8 bg-emerald-950/80 border border-emerald-500/40 rounded-2xl text-emerald-100 space-y-3 shadow-[0_0_30px_rgba(16,185,129,0.3)]">
                <div class="w-16 h-16 bg-emerald-500/20 border border-emerald-400/40 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-3xl shadow-inner">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <h3 class="font-black text-xl text-white">¡Evaluación Registrada!</h3>
                <p class="text-xs text-emerald-300 leading-relaxed">Muchas gracias por colaborar con tus respuestas en tiempo real para el prototipo EduSync.</p>
                <div class="pt-2">
                    <span class="inline-flex items-center gap-1.5 text-[10px] font-mono bg-emerald-400/20 text-emerald-300 border border-emerald-400/30 px-3 py-1 rounded-full">
                        <i class="fa-solid fa-wifi text-[9px] animate-pulse"></i> Sincronizado en Firebase
                    </span>
                </div>
            </div>

        </div>

    </main>

    <!-- FOOTER ACADEMIUM -->
    <footer class="mt-auto bg-[#120a2a]/80 border-t border-purple-500/20 py-4 text-center text-xs text-purple-300/60 relative z-10">
        © 2026 Desarrollado por Soluciones Integrales OMNISOFT Cía. Ltda.
    </footer>

    <!-- ========================================== -->
    <!-- SINTETIZADOR DE AUDIO Y LÓGICA DE TELEMETRÍA -->
    <!-- ========================================== -->
    <script>
        // --- 1. SINTETIZADOR WEB AUDIO API ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        ['pointerdown', 'touchstart', 'click'].forEach(evt => {
            document.addEventListener(evt, initAudio, { once: true });
        });

        function playClickSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(700, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e){}
        }

        function playStarSound(val) {
            try {
                initAudio();
                const baseFreq = 420 + (val * 110);
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.4, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e){}
        }

        function playSuccessSound() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (idx * 0.07));
                    gain.gain.setValueAtTime(0.15, now + (idx * 0.07));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (idx * 0.07) + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + (idx * 0.07));
                    osc.stop(now + (idx * 0.07) + 0.25);
                });
            } catch(e){}
        }

        function playErrorSound() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.setValueAtTime(110, now + 0.15);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(now + 0.3);
            } catch(e){}
        }

        // --- 2. CONTROL DE SELECCIÓN DE ESTRELLAS ---
        let currentRating = 0;
        function setRating(val) {
            currentRating = val;
            playStarSound(val);
            
            for (let i = 1; i <= 5; i++) {
                const btn = document.getElementById(`star-btn-${i}`);
                if (i <= val) {
                    btn.classList.add('text-amber-400', 'bg-amber-400/20', 'border-amber-400/60', 'shadow-[0_0_15px_rgba(245,158,11,0.4)]');
                    btn.classList.remove('text-slate-400', 'bg-slate-800/50', 'border-slate-700');
                } else {
                    btn.classList.remove('text-amber-400', 'bg-amber-400/20', 'border-amber-400/60', 'shadow-[0_0_15px_rgba(245,158,11,0.4)]');
                    btn.classList.add('text-slate-400', 'bg-slate-800/50', 'border-slate-700');
                }
            }
            document.getElementById(`star-${val}`).checked = true;
        }

        // --- 3. CONFIGURACIÓN FIREBASE & TELEMETRÍA ---
        const firebaseConfig = {
            databaseURL: "https://edusync-c85df-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('formEncuesta').addEventListener('submit', function(e) {
            e.preventDefault();

            if (currentRating === 0) {
                playErrorSound();
                alert("Por favor selecciona una calificación de 1 a 5 estrellas.");
                return;
            }
            
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Guardando en Nube...';

            const notaSeleccionada = document.querySelector('input[name="nota"]:checked');

            // Recopilación de metadatos técnicos del navegador
            const esMóvil = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
            const resolucion = `${window.screen.width}x${window.screen.height}`;
            const idioma = navigator.language || 'Desconocido';
            const zonaHoraria = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Desconocida';
            const orientacion = window.screen.orientation ? window.screen.orientation.type : 'N/A';

            db.ref('encuestas').push({
                // Datos del formulario
                rol: document.getElementById('rol').value,
                nota: notaSeleccionada ? notaSeleccionada.value : "N/A",
                funcion: document.getElementById('funcion').value,
                comentario: document.getElementById('comentario').value || "Sin comentarios",
                fecha: new Date().toLocaleString(),
                
                // Metadatos de usabilidad del dispositivo
                telemetria: {
                    dispositivo: esMóvil ? "Móvil / Tablet" : "Escritorio / Laptop",
                    resolucion: resolucion,
                    idioma: idioma,
                    zonaHoraria: zonaHoraria,
                    orientacion: orientacion,
                    userAgent: navigator.userAgent
                }
            }).then(() => {
                playSuccessSound();
                document.getElementById('formEncuesta').style.display = 'none';
                document.getElementById('mensaje').classList.remove('hidden');
            }).catch((err) => {
                playErrorSound();
                alert("Error de conexión al enviar la respuesta. Intenta de nuevo.");
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar respuesta';
            });
        });
    </script>
</body>
</html>
